name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, Node 24
        with:
          version: 10.26.2

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Security regression checks
        run: pnpm test:security

      - name: Rich-text regression checks
        run: pnpm test:rich-text

      - name: Hosting artifact contracts
        run: pnpm test:hosting

      - name: Database contracts in isolated PostgreSQL
        run: pnpm test:database

      - name: Read-only monitor contracts
        run: python3 -m unittest discover -s ops/health -p 'test_*.py' -v

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5, Node 24
        with:
          deno-version: v2.9.6

      - name: Payment and webhook contracts
        run: pnpm test:edge

      - name: Edge entry points and dashboard bundles
        run: |
          pnpm check:edge
          pnpm bundle:edge

      - name: Install browser for regression checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser regression checks
        run: pnpm test:browser

      - name: Build
        run: pnpm run build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0, Node 24

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './dist'

  deploy:
    # A manual run on a review branch validates/builds only. Publishing requires
    # main, even if workflow_dispatch is invoked from a different ref.
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1, Node 24
